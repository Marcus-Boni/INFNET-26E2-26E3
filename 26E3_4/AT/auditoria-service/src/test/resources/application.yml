spring:
  application:
    name: auditoria-service-test
  datasource:
    url: jdbc:h2:mem:auditoriadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false

app:
  kafka:
    topics:
      contratos: contratos.v1.events
