name: Nexus Store CI - TP5 Continuous Integration Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '26E2_5/TP5/**'
      - '.github/workflows/tp5-*.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '26E2_5/TP5/**'
      - '.github/workflows/tp5-*.yml'
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Principal (Testes & Qualidade)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '26E2_5/TP5/backend/pom.xml'

      - name: Executar Testes Automatizados do Backend
        working-directory: 26E2_5/TP5/backend
        run: mvn -B clean test

      - name: Publicar Relatório de Testes Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: 26E2_5/TP5/backend/target/surefire-reports/

  shipping-test:
    name: Shipping Service (Testes & Qualidade)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '26E2_5/TP5/shipping-service/pom.xml'

      - name: Executar Testes Automatizados do Microsserviço de Frete
        working-directory: 26E2_5/TP5/shipping-service
        run: mvn -B clean test

      - name: Publicar Relatório de Testes Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-test-results
          path: 26E2_5/TP5/shipping-service/target/surefire-reports/

  frontend-build:
    name: Frontend React (Instalação & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 26E2_5/TP5/frontend
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '26E2_5/TP5/frontend/package-lock.json'

      - name: Instalar Dependências do Frontend
        run: npm install

      - name: Executar Build de Produção do Vite
        run: npm run build

      - name: Publicar Bundle de Produção
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 26E2_5/TP5/frontend/dist/

  k8s-validation:
    name: Validação de Manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ferramenta kubectl
        uses: azure/setup-kubectl@v3

      - name: Validar Sintaxe dos Manifestos com Kustomize Dry-Run
        working-directory: 26E2_5/TP5/k8s
        run: |
          kubectl kustomize . > k8s-compiled.yaml
          kubectl apply --dry-run=client --validate=false -f k8s-compiled.yaml
