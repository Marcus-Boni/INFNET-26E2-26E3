name: CI fornecedores-service

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build fornecedores-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '26E3_3/AT/fornecedores-service/pom.xml'

      - name: Compilar fornecedores-service com Maven
        working-directory: 26E3_3/AT/fornecedores-service
        run: mvn clean package -DskipTests -B
