name: Nexus Store CD - TP5 Continuous Delivery & Packaging

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - '26E2_5/TP5/**'
      - '.github/workflows/tp5-*.yml'
  workflow_dispatch:

jobs:
  docker-build:
    name: Build & Packaging de Contêineres Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: ./26E2_5/TP5/backend
            image: nexus-store/backend
          - name: shipping-service
            context: ./26E2_5/TP5/shipping-service
            image: nexus-store/shipping-service
          - name: frontend
            context: ./26E2_5/TP5/frontend
            image: nexus-store/frontend
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker (Dry-run / Validação de Camadas)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ${{ matrix.service.image }}:${{ github.sha }}, ${{ matrix.service.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dry-run:
    name: Simulação de Implantação em Cluster Kubernetes
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ferramenta kubectl
        uses: azure/setup-kubectl@v3

      - name: Renderizar Manifestos Kustomize com Nova Tag
        working-directory: 26E2_5/TP5/k8s
        run: |
          kubectl kustomize . > manifests-deployed.yaml
          cat manifests-deployed.yaml | grep -E "image:|name:" | head -n 30
