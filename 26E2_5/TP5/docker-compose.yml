version: '3.8'

services:
  # Message Broker RabbitMQ com plugin de gerenciamento Web
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexus-rabbitmq
    ports:
      - "5672:5672"     # Porta AMQP do Broker
      - "15672:15672"   # Painel Web de Gerenciamento do RabbitMQ (login: guest/guest)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 25s
    networks:
      - nexus-network

  # Distributed Tracing com Zipkin
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: nexus-zipkin
    ports:
      - "9411:9411"     # UI do Zipkin e endpoint de ingestão /api/v2/spans
    networks:
      - nexus-network

  # Coletor de Métricas Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - nexus-network

  # Dashboard de Métricas Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - nexus-network

  # Microsserviço de Logística e Frete
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: nexus-shipping-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - ZIPKIN_URL=http://zipkin:9411
    depends_on:
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - nexus-network

  # Backend Principal / Catálogo, Pedidos e Auditoria
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - SHIPPING_SERVICE_URL=http://shipping-service:8082
      - ZIPKIN_URL=http://zipkin:9411
    depends_on:
      rabbitmq:
        condition: service_healthy
      shipping-service:
        condition: service_started
      zipkin:
        condition: service_started
    networks:
      - nexus-network

  # Frontend SPA React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_SHIPPING_API_URL=http://localhost:8082/api/v1/shipping
    depends_on:
      - backend
      - shipping-service
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
