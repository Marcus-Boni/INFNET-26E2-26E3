# Application Configuration
spring.application.name=tp5-backend
server.port=8080

# Database Configuration (In-Memory H2 - Database-per-Service: orderdb)
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Spring Cloud OpenFeign Configuration
spring.cloud.openfeign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=3000

# Microservices URLs
shipping.service.url=${SHIPPING_SERVICE_URL:http://localhost:8082}

# RabbitMQ Configuration (Event-Driven Architecture)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Spring Boot Actuator & Kubernetes Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Micrometer Metrics & Prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.export.prometheus.enabled=true

# Distributed Tracing (Micrometer Tracing + Zipkin)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

# Structured Logging with Distributed Tracing (TraceId, SpanId)
logging.level.com.infnet.tp5=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.amqp=INFO
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
