version: '3.8'

services:
  # Microsserviço de Autenticação e Emissão de Tokens (auth-service)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: techmarket-auth-service:latest
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JWT_SECRET=techmarket-super-secret-jwt-key-for-authentication-and-authorization-2026-infnet-disciplined-software-engineering
      - JWT_ACCESS_TOKEN_EXPIRATION_MS=900000
      - JWT_REFRESH_TOKEN_EXPIRATION_MS=604800000
    networks:
      - techmarket-net
    restart: unless-stopped

  # Microsserviço de Pedidos com Rotas Protegidas (order-service)
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: techmarket-order-service:latest
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - JWT_SECRET=techmarket-super-secret-jwt-key-for-authentication-and-authorization-2026-infnet-disciplined-software-engineering
    depends_on:
      - auth-service
    networks:
      - techmarket-net
    restart: unless-stopped

networks:
  techmarket-net:
    name: techmarket-net
    driver: bridge
