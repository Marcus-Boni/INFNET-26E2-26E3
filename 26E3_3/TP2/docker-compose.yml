version: '3.8'

services:
  # Microsserviço de Produtos
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: product-image:latest
    container_name: product-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
    networks:
      - techmarket-net
    restart: unless-stopped

  # Microsserviço de Pedidos
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: order-image:latest
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - PRODUCT_SERVICE_URL=http://product-service:8081/products
    depends_on:
      - product-service
    networks:
      - techmarket-net
    restart: unless-stopped

networks:
  techmarket-net:
    name: techmarket-net
    driver: bridge
