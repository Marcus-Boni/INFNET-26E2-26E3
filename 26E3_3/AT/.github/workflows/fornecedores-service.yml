# ==============================================================================
# NOTA SOBRE A ESTRUTURA DO REPOSITÓRIO:
# O GitHub Actions exige que os arquivos de workflow fiquem obrigatoriamente
# na raiz do repositório Git (.github/workflows/fornecedores-service.yml).
# Este arquivo é mantido aqui dentro de 26E3_3/AT como referência local da entrega.
# O workflow ativo e executado pelo GitHub está em /.github/workflows/fornecedores-service.yml
# ==============================================================================
name: CI fornecedores-service

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build fornecedores-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar fornecedores-service com Maven
        working-directory: ./fornecedores-service
        run: mvn clean package -DskipTests -B
